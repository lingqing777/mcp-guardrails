# MCP Guardrails - MCP 安全网关
#
# ============================== 架构说明 ==============================
#
#   ┌─────────┐     ┌─────────────────── 宿主机 ───────────────────┐
#   │  Agent  │────▶│  MCP Hub (WAF1)  ────▶  MCP Server (stdio)  │
#   │         │     └────────────────────────────┬────────────────┘
#   └─────────┘                                  │ HTTP
#                   ┌─────────────── Docker ─────┼────────────────┐
#                   │                            ▼                │
#                   │  WAF2 (:8081)  ────▶  目标应用 (TARGET_URL) │
#                   └─────────────────────────────────────────────┘
#
# ============================== 快速开始 ==============================
#
# 1. 配置 .env 文件:
#    - TARGET_URL: 你要保护的目标应用地址
#    - QWEN_API_KEY: LLM API 密钥 (用于 WAF2 语义分析)
#
# 2. 启动服务:
#    docker-compose up -d
#
# 3. 启动 MCP Hub:
#    cd mcp-hub && npm install && npm start
#
# =====================================================================

services:
  # ==================== WAF2 - HTTP 层 LLM 动态检测 ====================
  waf2:
    build: ./waf2
    container_name: waf2
    ports:
      - "${WAF2_PORT:-8081}:8081"
    environment:
      - UPSTREAM=${TARGET_URL:-http://host.docker.internal:3000}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-qwen-turbo}
      - VERIFY_SSL=${VERIFY_SSL:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mcp-net
    restart: unless-stopped

networks:
  mcp-net:
    driver: bridge
