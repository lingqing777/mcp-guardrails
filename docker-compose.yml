services:
  # 目标靶机 - Juice Shop
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    ports:
      - "3000:3000"
    networks:
      - mcp-net

  # WAF2 - HTTP 层 LLM 动态检测
  waf2:
    build: ./waf2
    container_name: waf2
    ports:
      - "8081:8081"
    environment:
      - UPSTREAM=http://juice-shop:3000
      - QWEN_API_KEY=${QWEN_API_KEY:-sk-your-api-key}
    depends_on:
      - juice-shop
    networks:
      - mcp-net

  # MCP Hub - 多靶机协同平台
  mcphub:
    build: ./mcp-hub
    container_name: mcphub
    networks:
      - mcp-net
    depends_on:
      - juice-shop
      - waf2
    ports:
      - "4000:4000"

networks:
  mcp-net:
    driver: bridge
