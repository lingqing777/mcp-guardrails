# MCP Guardrails - 通用 MCP WAF 安全网关
#
# 快速开始:
#   1. cp .env.example .env
#   2. 编辑 .env 中的 TARGET_URL (指向你要测试的应用)
#   3. docker-compose up -d
#
# 目标应用场景:
#   - 本机应用: TARGET_URL=http://host.docker.internal:3000
#   - 外网应用: TARGET_URL=https://example.com
#   - 内置靶机: docker-compose -f docker-compose.yml -f targets/juice-shop.yml up -d

services:
  # ==================== WAF2 - HTTP 层 LLM 动态检测 ====================
  waf2:
    build: ./waf2
    container_name: waf2
    ports:
      - "${WAF2_PORT:-8081}:8081"
    environment:
      - UPSTREAM=${TARGET_URL:-http://host.docker.internal:3000}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-qwen-turbo}
      - VERIFY_SSL=${VERIFY_SSL:-true}
    extra_hosts:
      # Linux 需要这个来访问宿主机，Windows/Mac Docker Desktop 已内置
      - "host.docker.internal:host-gateway"
    networks:
      - mcp-net
    restart: unless-stopped

  # ==================== MCP Hub - WAF1 协议层检测 ====================
  mcphub:
    build: ./mcp-hub
    container_name: mcphub
    ports:
      - "${MCP_HUB_PORT:-4000}:4000"
    environment:
      - GUARDRAILS_CONFIG=/app/config/guardrails-config.json
      - MCP_SERVERS_CONFIG=/app/config/mcp-servers.json
      - TARGET_URL=${TARGET_URL:-http://host.docker.internal:3000}
      - TARGET_NAME=${TARGET_NAME:-target-app}
      - TARGET_DISPLAY_NAME=${TARGET_DISPLAY_NAME:-Target Application}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config
    networks:
      - mcp-net
    restart: unless-stopped

networks:
  mcp-net:
    driver: bridge
