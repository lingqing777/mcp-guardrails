# MCP Guardrails - MCP 安全网关
#
# ============================== 架构说明 ==============================
#
#   ┌─────────┐     ┌─────────────────── 宿主机 ───────────────────┐
#   │  Agent  │────▶│  MCP Hub (WAF1)  ────▶  MCP Server (stdio)  │
#   │ (Cursor)│     └────────────────────────────┬────────────────┘
#   └─────────┘                                  │ HTTP
#                   ┌─────────────── Docker ─────┼────────────────┐
#                   │                            ▼                │
#                   │  WAF2 (:8081)  ────▶  目标应用 (:3000)      │
#                   └─────────────────────────────────────────────┘
#
# ============================== 快速开始 ==============================
#
# 步骤 1: 启动 Docker 服务 (WAF2 + 目标应用)
#
#   # 使用内置靶机 (Juice Shop)
#   docker-compose -f docker-compose.yml -f targets/juice-shop.yml up -d
#
#   # 或代理到你自己的应用
#   编辑 .env 设置 TARGET_URL，然后: docker-compose up -d
#
# 步骤 2: 启动 MCP Hub (在 mcp-hub 目录)
#
#   cd mcp-hub && npm install && npm start
#
# 步骤 3: 配置你的 Agent 连接 http://localhost:4000
#
# =====================================================================

services:
  # ==================== WAF2 - HTTP 层 LLM 动态检测 ====================
  waf2:
    build: ./waf2
    container_name: waf2
    ports:
      - "${WAF2_PORT:-8081}:8081"
    environment:
      - UPSTREAM=${TARGET_URL:-http://host.docker.internal:3000}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-qwen-turbo}
      - VERIFY_SSL=${VERIFY_SSL:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mcp-net
    restart: unless-stopped

networks:
  mcp-net:
    driver: bridge
